[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenid"
version = "1.0.1"
authors = [
  { name="Pixeldaguy" }
]
description = "A Highly Secure Watermark Tool made to verify the author for text,image and audio"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "Pillow>=9.0.0",
    "windows-curses; platform_system=='Windows'"
]

[project.scripts]
zenid = "zenid.cli:main"